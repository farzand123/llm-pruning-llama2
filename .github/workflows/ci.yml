name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: pure-Python core (selection, counting, config, report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==1.26.4 pyyaml pytest matplotlib
      - run: python -m pytest -q
      - run: python scripts/analytic_checks.py
      - run: python scripts/run_matrix.py --config configs/full.yaml --dry-run
      - run: python scripts/run_matrix.py --config configs/quick.yaml --dry-run

  torch:
    name: PyTorch code on a tiny random LLaMA (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - name: torch 2.2.0 (CPU build)
        run: python -m pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
      - name: rest of the thesis stack (Table 10)
        run: >
          python -m pip install numpy==1.26.4 transformers==4.38.2 peft==0.10.0 accelerate==0.27.0
          "huggingface_hub>=0.20,<0.26" safetensors tokenizers sentencepiece protobuf tqdm pyyaml pytest matplotlib
      - run: python -m pip install -e . --no-deps
      - name: self-test (head/layer/magnitude pruning, LoRA, perplexity, recipes)
        run: python scripts/run_selftest.py
      - run: python -m pytest -q
